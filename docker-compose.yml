services:
  postgres:
    image: postgres:16-alpine
    container_name: boosta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: boosta_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres_password@postgres:5432/app_db?schema=public
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/src/main.js"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: boosta_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      BACKEND_URL: http://server:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

volumes:
  postgres_data:
  server_node_modules:
  client_node_modules: